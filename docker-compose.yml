services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: searchdb, POSTGRES_USER: search, POSTGRES_PASSWORD: search}
    ports: ["5432:5432"]
  search-service:
    build: {context: ., dockerfile: search-service/Dockerfile}
    environment: {DB_HOST: postgres}
    depends_on: [postgres]
    ports: ["8081:8081"]
  ingest-service:
    build: {context: ., dockerfile: ingest-service/Dockerfile}
    environment: {SEARCH_URL: http://search-service:8081}
    depends_on: [search-service]
    ports: ["8082:8082"]
